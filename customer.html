<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grocery Store - Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">🛒 Grocery Store</div>
    <input class="search" id="search" type="search" placeholder="Search products...">
    <span class="pill" id="cart-pill">🧺 0</span>
    <span class="pill" id="who"></span>
    <button class="header-btn" id="logout">Log out</button>
  </header>

  <main class="page">
    <!-- SHOP VIEW -->
    <section id="view-shop">
      <div class="chips" id="chips"></div>
      <div class="shop-layout">
        <div class="grid" id="grid"></div>
        <aside class="card cart">
          <div class="section-title">Your cart</div>
          <div class="cart-rows" id="cart-rows"></div>
          <div class="total-row"><b>Total</b><span class="price" id="total">0 ₫</span></div>
          <button class="btn primary block" id="place">Place order</button>
        </aside>
      </div>
    </section>

    <!-- MY ORDERS VIEW -->
    <section id="view-orders" class="hidden">
      <div class="section-title">Your orders</div>
      <div id="orders"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="shop">🏪 Shop</button>
    <button class="nav-item" data-view="orders">📦 My orders</button>
  </nav>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
